[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-custom"
version = "0.1.0"
description = "Visual automation library and platform adapters (ADB, Robot)"
readme = "core/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.54",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
vision = "vision_app.cli:main"
vision-mcp = "vision_app.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "core", "vision_app" = "vision_app"}
py-modules = ["entry", "main", "run_script", "find_game_package"]

[tool.setuptools.packages.find]
where = ["core", "."]
include = ["service*", "script*", "vision_app*"]
exclude = ["vision_app.test*", "service.test*", "script.test*"]
